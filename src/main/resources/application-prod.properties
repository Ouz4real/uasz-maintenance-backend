# ================= DATASOURCE PROD (Neon PostgreSQL) =================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de connexions (important pour Neon qui ferme les connexions inactives)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000

# ================= JPA PROD =================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ================= CORS PROD =================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://uasz-maintenance-frontend.netlify.app}

# ================= FRONTEND URL =================
app.frontend.url=${CORS_ALLOWED_ORIGINS:https://uasz-maintenance-frontend.netlify.app}

# ================= EMAIL PROD (port 465 SSL - Render bloque 587) =================
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ================= LOGS PROD =================
logging.level.sn.uasz=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# ================= ACTUATOR =================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ================= SERVER =================
server.port=${PORT:8080}